services:
  postgres:
    image: postgres:16
    container_name: nexacart-postgres
    environment:
      POSTGRES_DB: nexacart_portfolio1
      POSTGRES_USER: nexacart_user
      POSTGRES_PASSWORD: nexacart_password
    ports:
      - "55432:5432"
    volumes:
      - nexacart_postgres_data:/var/lib/postgresql/data
      - ./portfolio-1-database-design/sql:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexacart_user -d nexacart_portfolio1"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8.0.30-noble
    container_name: nexacart-mongo
    ports:
      - "27017:27017"
    volumes:
      - nexacart_mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand({ ping: 1 }).ok\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexacart_postgres_data:
  nexacart_mongo_data:
